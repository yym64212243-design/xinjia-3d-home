<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#161613" />
    <meta
      name="description"
      content="手机直接打开的沉浸式住宅 VR：八个房间、五种装修风格、清晨中午夜晚三种光照。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="我们的新家 · 沉浸式 VR" />
    <meta
      property="og:description"
      content="站在房间里拖动看 360°，切换五种写实装修风格和三个时段。"
    />
    <meta
      property="og:image"
      content="https://yym64212243-design.github.io/xinjia-3d-home/og-vr-five-styles.png"
    />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>我们的新家 · 沉浸式 VR</title>
    <link rel="preload" href="./ai-panoramas/modern_wood/living.png" as="image" />
    <link rel="stylesheet" href="./pannellum.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./pannellum.js"></script>
    <script defer src="./viewer.js"></script>
  </head>
  <body>
    <main class="vr-app" id="vr-app">
      <section class="panorama-stage" id="panorama-stage" aria-label="住宅 360 度全景">
        <div id="panorama"></div>

        <header class="vr-topbar">
          <div class="identity">
            <span class="identity-mark" aria-hidden="true">宅</span>
            <div>
              <small id="floor-name">F1 · 一楼</small>
              <h1 id="scene-name">客厅</h1>
            </div>
          </div>
          <div class="top-actions">
            <button class="icon-button" id="share-button" type="button" aria-label="分享链接">
              <span aria-hidden="true">↗</span>
            </button>
            <button class="icon-button" id="help-button" type="button" aria-label="操作说明">
              <span aria-hidden="true">?</span>
            </button>
          </div>
        </header>

        <div class="mode-bar" aria-label="装修风格和时间">
          <button class="mode-pill mode-pill--style" id="style-button" type="button">
            <span class="mini-swatches" id="active-swatches" aria-hidden="true"></span>
            <span><small>装修风格</small><strong id="style-name">现代原木</strong></span>
            <span aria-hidden="true">⌄</span>
          </button>
          <div class="time-switch" id="time-switch" role="group" aria-label="选择时段"></div>
        </div>

        <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
          <div class="loading-ring" aria-hidden="true"></div>
          <strong>正在进入<span id="loading-scene">客厅</span>…</strong>
          <small>正在准备 360° 写实全景</small>
        </div>

        <div class="error-screen" id="error-screen" hidden role="alert">
          <strong>这个房间暂时没有加载出来</strong>
          <p>请检查网络后再试一次。</p>
          <button id="retry-button" type="button">重新加载</button>
        </div>

        <div class="gesture-guide" id="gesture-guide">
          <span aria-hidden="true">↔</span>
          拖动环视 · 双指缩放 · 点地标换房间
        </div>

        <nav class="tool-rail" aria-label="VR 工具">
          <button id="gyro-button" type="button" aria-pressed="false">
            <span aria-hidden="true">◉</span><small>陀螺仪</small>
          </button>
          <button id="fullscreen-button" type="button">
            <span aria-hidden="true">⛶</span><small>全屏</small>
          </button>
        </nav>

        <section class="scene-dock" aria-label="选择房间">
          <div class="scene-dock-title">
            <span>空间漫游</span>
            <small><b id="scene-index">01</b> / 08</small>
          </div>
          <div class="scene-list" id="scene-list"></div>
        </section>
      </section>

      <aside class="bottom-sheet" id="style-sheet" hidden>
        <button class="sheet-backdrop" data-close-sheet type="button" aria-label="关闭"></button>
        <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="style-title">
          <div class="sheet-handle" aria-hidden="true"></div>
          <header>
            <div>
              <small>一键切换整套软装与材质</small>
              <h2 id="style-title">选择装修风格</h2>
            </div>
            <button class="sheet-close" data-close-sheet type="button" aria-label="关闭">×</button>
          </header>
          <div class="style-grid" id="style-grid"></div>
          <p class="sheet-note">户型、墙体、门窗、电梯井和床的方向均保持设计图不变。</p>
        </section>
      </aside>

      <aside class="help-panel" id="help-panel" hidden>
        <button class="sheet-backdrop" data-close-help type="button" aria-label="关闭"></button>
        <section class="sheet-panel sheet-panel--help" role="dialog" aria-modal="true">
          <div class="sheet-handle" aria-hidden="true"></div>
          <h2>像在房间里一样看</h2>
          <ol>
            <li><b>拖动屏幕</b><span>向四周和上下环视</span></li>
            <li><b>双指张合</b><span>放大或缩小细节</span></li>
            <li><b>点击地面箭头</b><span>走到另一个房间</span></li>
            <li><b>开启陀螺仪</b><span>转动手机改变视角</span></li>
          </ol>
          <button class="primary-button" data-close-help type="button">开始参观</button>
        </section>
      </aside>

      <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
